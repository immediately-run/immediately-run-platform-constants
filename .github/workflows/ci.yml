name: ci

# Build, test, lint on every PR + push; publish to npm on push to main via npm
# trusted publishing (OIDC), mirroring preauth-core / the SDK release job. cli,
# sandbox, and site-main consume this package as an ordinary pinned npm dependency
# (NOT a file: sibling), so it must be published for their CI `npm ci`/tsc to resolve
# it. NOTE (R3-104 rollout): npm trusted publishing must be configured for this
# package on npmjs.com before the first publish succeeds; until then this job's
# build/test/lint still run, only the publish step is inert (it skips if the version
# is already published and otherwise needs the OIDC trust link).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v6
        with:
          # R3-327 check 2 diffs this branch against its merge base, so it needs the
          # history to find one. A depth-1 checkout has none, and the check refuses to
          # report success without a diff (an undetermined answer is not a pass), so a
          # shallow clone would fail it rather than skip it.
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false # never cache in release builds
      # Trusted publishing requires npm >= 11.5.1
      - run: npm install -g npm@latest
      # R3-327 check 1 — a pin to an unpublished @immediately-run/* version, and a
      # package.json/package-lock.json disagreement about it. Runs BEFORE `npm ci`,
      # deliberately: that is the command such a pin breaks, so afterwards the
      # informative message never appears — the run has already died on 40 lines of
      # `ETARGET` nobody reads, which is why the red check on sdk #112 read as noise
      # and merged anyway. `--self-test` runs first: a gate that cannot fail is not a
      # gate, and it replays sdk #112's real diff rather than a hypothetical.
      - run: npm run check:pins
      # R3-327 check 2 — shipped bytes changed and `version` did not. The publish step
      # below already refuses this, correctly, but only on a push to `main`: a PR never
      # runs it, so the cost lands on `main` and on whoever pushes next. Same question,
      # moved to PR time. Replays sdk #111's real diff in its `--self-test`.
      - name: Shipped bytes changed ⇒ the version was bumped in this PR (R3-327)
        if: github.event_name == 'pull_request'
        run: npm run check:publish-version
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run lint
      # R3-275: both sides of the sandbox<->SDK seam depend on this package and it
      # depends on neither — that is what makes it a safe home for shared vocabulary.
      # A runtime dep added here is inherited by every consumer, including the
      # browser bundle. Asserted, not remembered.
      - run: npm run check:dependency-free
      - name: Publish to npm via trusted publishing (skip if version already published)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          # setup-node's registry-url writes an .npmrc bound to NODE_AUTH_TOKEN.
          # Clearing it forces OIDC trusted publishing instead of (empty) token auth.
          NODE_AUTH_TOKEN: ""
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VER=$(node -p "require('./package.json').version")
          if npm view "$PKG_NAME@$PKG_VER" version >/dev/null 2>&1; then
            echo "::notice::$PKG_NAME@$PKG_VER already published — skipping."
            exit 0
          fi
          npm publish --access public
